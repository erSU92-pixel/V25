name: Run Trading Bot Every 15 Minutes

on:
  schedule:
    # Berjalan setiap 15 menit (UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write  # Diperlukan jika nanti bot ingin commit file data DNA/Journal kembali ke repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Data Directory
        run: mkdir -p data

      - name: Run Trading Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MT5_OFFSET: ${{ secrets.MT5_OFFSET || '0.0' }}
          DERIV_SYMBOL: ${{ secrets.DERIV_SYMBOL || 'frxXAUUSD' }}
        run: |
          python bot_v25.py

      - name: Upload Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            *.log
            data/*.json
          retention-days: 7
