# =============================================================================
# KONFIGURASI BOT TRADING V25.0 ULTIMATE
# =============================================================================

bot:
  symbol: "frxXAUUSD"
  deriv_app_id: "1089"
  mt5_offset: 0.0
  consensus_threshold: 60
  signal_cooldown_minutes: 30

telegram:
  token: ""
  chat_id: ""

data_sources:
  deriv:
    enabled: true
    candle_limit_m15: 300
    candle_limit_h1: 200
    candle_limit_h4: 200
    timeout: 10
    max_retries: 3
  binance:
    enabled: true
    symbol: "PAXGUSDT"
    timeout: 6
  yahoo:
    enabled: false               # <--- DIMATIKAN agar tidak ada noise selisih $46.50
    symbol: "GC=F"
    period: "2d"
    interval: "15m"
    offset: -46.50               # <--- Offset siap jika Ceu ingin mengaktifkannya lagi

risk_management:
  atr_period: 14
  sl_min: 6.0
  sl_max: 16.0
  sl_buffer: 1.2
  tp_multipliers:
    tp1: 1.3
    tp2: 2.2
    tp3: 3.5
    tp4: 5.0

session:
  timezone: "Asia/Jakarta"
  active_hours:
    start: 13
    end: 23
  active_mult: 1.35
  low_mult: 1.15

validation:
  max_price_deviation: 25.0

dna:
  weight_min: 0.5
  weight_max: 2.0
  reward_aligned: 0.02
  penalty_opposed: -0.03
  mean_reversion_rate: 0.05

paths:
  dna_file: "data/dna_10_engines.json"
  journal_file: "data/trade_journal.json"
  chart_path: "/tmp/chart_v250.png"
  journal_max_entries: 50

logging:
  level: "INFO"
