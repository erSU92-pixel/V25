# =============================================================================
# KONFIGURASI BOT TRADING V25.0 HYBRID ULTIMATE
# =============================================================================

bot:
  symbol: "GC=F"
  mt5_offset: 0.0
  consensus_threshold: 60
  signal_cooldown_minutes: 30

telegram:
  token: ""
  chat_id: ""

data_sources:
  yahoo:
    enabled: true
    symbol: "GC=F"
    period_m15: "5d"
    interval_m15: "15m"
    offset: -46.50               # <--- Offset Futures ke Spot
  gold_api:
    enabled: true
    url: "https://api.metals.live/v1/spot/gold"
  coingecko:
    enabled: true
    url: "https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd"
  binance:
    enabled: true
    symbol: "PAXGUSDT"
    url: "https://api.binance.com/api/v3/ticker/price"

risk_management:
  atr_period: 14
  sl_min: 6.0
  sl_max: 16.0
  sl_buffer: 1.2
  tp_multipliers:
    tp1: 1.3
    tp2: 2.2
    tp3: 3.5
    tp4: 5.0

session:
  timezone: "Asia/Jakarta"
  active_hours:
    start: 13
    end: 23
  active_mult: 1.35
  low_mult: 1.15

validation:
  max_price_deviation: 25.0

dna:
  weight_min: 0.5
  weight_max: 2.0
  reward_aligned: 0.02
  penalty_opposed: -0.03
  mean_reversion_rate: 0.05

paths:
  dna_file: "data/dna_10_engines.json"
  journal_file: "data/trade_journal.json"
  chart_path: "/tmp/chart_v250.png"
  journal_max_entries: 50

logging:
  level: "INFO"
