# =============================================================================
# KONFIGURASI BOT TRADING V25.0 HYBRID ULTIMATE (ZERO-API SPOT XAUUSD)
# =============================================================================

bot:
  symbol: "XAUUSD"
  mt5_offset: 0.0                # Offset manual jika broker kamu punya markup spread tambahan
  consensus_threshold: 60
  signal_cooldown_minutes: 30

telegram:
  token: ""
  chat_id: ""

data_sources:
  biquote:
    enabled: true
    url: "https://biquote.io/api/XAUUSD"
    offset: 0.0                  # Murni Spot XAUUSD (Akursi tinggi)
  tradingview:
    enabled: true
    url: "https://scanner.tradingview.com/forex/scan"
    symbol: "OANDA:XAUUSD"
    offset: 0.0                  # Spot XAUUSD OANDA
  yahoo:
    enabled: true
    symbol: "GC=F"
    period_m15: "5d"
    interval_m15: "15m"
    offset: -34.30               # Offset penyesuaian Gold Futures (GC=F) ke Spot XAUUSD

risk_management:
  atr_period: 14
  sl_min: 6.0
  sl_max: 16.0
  sl_buffer: 1.2
  tp_multipliers:
    tp1: 1.3
    tp2: 2.2
    tp3: 3.5
    tp4: 5.0

session:
  timezone: "Asia/Jakarta"
  active_hours:
    start: 13
    end: 23
  active_mult: 1.35
  low_mult: 1.15

validation:
  max_price_deviation: 25.0

dna:
  weight_min: 0.5
  weight_max: 2.0
  reward_aligned: 0.02
  penalty_opposed: -0.03
  mean_reversion_rate: 0.05

paths:
  dna_file: "data/dna_10_engines.json"
  journal_file: "data/trade_journal.json"
  chart_path: "/tmp/chart_v250.png"
  journal_max_entries: 50

logging:
  level: "INFO"
